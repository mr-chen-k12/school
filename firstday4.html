<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classroom Setup Checklist</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 700px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 6px;
    }

    button, label.btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-block;
    }

    button:hover, label.btn:hover {
      background-color: var(--accent-hover);
    }

    button.secondary {
      background-color: #6b7280;
    }

    button.secondary:hover {
      background-color: #4b5563;
    }

    .add-task-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-task-container input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .add-task-container input:focus {
      border-color: var(--accent-color);
    }

    #file-input {
      display: none;
    }

    ul.task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 8px;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .task-item.dragging {
      opacity: 0.4;
      background-color: #eff6ff;
    }

    .task-item.over {
      border-top: 3px solid var(--accent-color);
    }

    .drag-handle {
      margin-right: 12px;
      color: #9ca3af;
      font-size: 1.3rem;
      padding: 4px 8px;
      cursor: grab;
      touch-action: none; /* Crucial for iOS touch drag */
    }

    .task-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
    }

    .task-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-text {
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
      background: #e0e7ff;
      color: #3730a3;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Classroom Setup</h1>
      <div class="controls">
        <button onclick="exportData()">Export</button>
        <label class="btn" for="file-input">Import</label>
        <input type="file" id="file-input" accept=".json" onchange="importData(event)">
        <button class="secondary" onclick="resetDefaults()">Reset</button>
      </div>
    </header>

    <div class="add-task-container">
      <input type="text" id="task-input" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
      <button onclick="addTask()">Add</button>
    </div>

    <ul class="task-list" id="task-list"></ul>
  </div>

  <script>
    const STORAGE_KEY = 'classroom_setup_tasks';

    const defaultTasks = [
      { id: '1', text: 'Load car: 3D printers, beach cart, HP computers, orange fan, & supplies', category: 'Logistics', checked: false },
      { id: '2', text: 'Pick up Alex & Harry', category: 'Logistics', checked: false },
      { id: '3', text: 'Access classroom via back door (use beach cart if elevator fails)', category: 'Logistics', checked: false },
      { id: '4', text: 'Unload all equipment and boxes into classroom', category: 'Logistics', checked: false },
      { id: '5', text: 'Wipe down and sanitize tables, counters, and stations', category: 'Prep', checked: false },
      { id: '6', text: 'Set up computer stations and arrange monitors', category: 'Tech', checked: false },
      { id: '7', text: 'Power test all HP desktop computers', category: 'Tech', checked: false },
      { id: '8', text: 'Connect and configure QR code scanner', category: 'Tech', checked: false },
      { id: '9', text: 'Hit up Staples / Dollar Store for decorative paper rolls & trims', category: 'Errands', checked: false },
      { id: '10', text: 'Team lunch break with Alex & Harry', category: 'Break', checked: false },
      { id: '11', text: 'Staple decorative paper/wallpaper onto walls', category: 'Decor', checked: false },
      { id: '12', text: 'Install decorative trim along paper borders', category: 'Decor', checked: false },
      { id: '13', text: 'Future Project: Python Facial Recognition Attendance System', category: 'Future', checked: false }
    ];

    let tasks = [];

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { tasks = JSON.parse(saved); } catch (e) { tasks = [...defaultTasks]; }
      } else {
        tasks = [...defaultTasks];
      }
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function render() {
      const listEl = document.getElementById('task-list');
      listEl.innerHTML = '';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.checked ? 'completed' : ''}`;
        li.dataset.index = index;

        li.innerHTML = `
          <span class="drag-handle">⋮⋮</span>
          <input type="checkbox" ${task.checked ? 'checked' : ''} onchange="toggleTask(${index})">
          <div class="task-content">
            <span class="task-text">${task.text}</span>
            <span class="badge">${task.category}</span>
          </div>
        `;

        addMouseDragListeners(li);
        addTouchDragListeners(li);
        listEl.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now().toString(),
        text: text,
        category: 'Custom',
        checked: false
      });

      input.value = '';
      save();
      render();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') addTask();
    }

    function toggleTask(index) {
      tasks[index].checked = !tasks[index].checked;
      save();
      render();
    }

    // --- Desktop Mouse Drag & Drop ---
    let draggedIndex = null;

    function addMouseDragListeners(item) {
      item.draggable = true;

      item.addEventListener('dragstart', (e) => {
        draggedIndex = +item.dataset.index;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        draggedIndex = null;
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      item.addEventListener('dragenter', () => item.classList.add('over'));
      item.addEventListener('dragleave', () => item.classList.remove('over'));

      item.addEventListener('drop', (e) => {
        e.preventDefault();
        item.classList.remove('over');
        const targetIndex = +item.dataset.index;

        if (draggedIndex !== null && draggedIndex !== targetIndex) {
          const [movedItem] = tasks.splice(draggedIndex, 1);
          tasks.splice(targetIndex, 0, movedItem);
          save();
          render();
        }
      });
    }

    // --- Mobile Touch Drag & Drop (for iOS Chrome & Safari) ---
    let touchDraggedIndex = null;

    function addTouchDragListeners(item) {
      const handle = item.querySelector('.drag-handle');

      handle.addEventListener('touchstart', (e) => {
        touchDraggedIndex = +item.dataset.index;
        item.classList.add('dragging');
      }, { passive: true });

      handle.addEventListener('touchmove', (e) => {
        e.preventDefault(); // Prevents page scrolling while dragging task
        const touch = e.touches[0];
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetItem = targetEl ? targetEl.closest('.task-item') : null;

        document.querySelectorAll('.task-item').forEach(el => el.classList.remove('over'));

        if (targetItem && targetItem !== item) {
          targetItem.classList.add('over');
        }
      }, { passive: false });

      handle.addEventListener('touchend', (e) => {
        item.classList.remove('dragging');
        const touch = e.changedTouches[0];
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetItem = targetEl ? targetEl.closest('.task-item') : null;

        document.querySelectorAll('.task-item').forEach(el => el.classList.remove('over'));

        if (targetItem && touchDraggedIndex !== null) {
          const targetIndex = +targetItem.dataset.index;
          if (touchDraggedIndex !== targetIndex) {
            const [movedItem] = tasks.splice(touchDraggedIndex, 1);
            tasks.splice(targetIndex, 0, movedItem);
            save();
            render();
          }
        }
        touchDraggedIndex = null;
      });
    }

    // --- Import / Export ---
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `classroom_setup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedTasks = JSON.parse(e.target.result);
          if (Array.isArray(importedTasks)) {
            tasks = importedTasks;
            save();
            render();
          } else {
            alert('Invalid file format.');
          }
        } catch (err) {
          alert('Error parsing JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function resetDefaults() {
      if (confirm('Reset to default tasks? Current progress will be overwritten.')) {
        tasks = [...defaultTasks];
        save();
        render();
      }
    }

    init();
  </script>
</body>
</html>
